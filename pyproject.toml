[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycorerelator"
version = "1.0.3"
description = "A package for quantitative stratigraphic correlation across geological core and physical log data"
readme = "README-pypi.md"
authors = [{name = "Larry Syu-Heng Lai", email = "larrysyuhenglai@gmail.com"}]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "Pillow>=8.3.0",
    "imageio>=2.9.0",
    "librosa>=0.9.0",
    "tqdm>=4.60.0",
    "joblib>=1.1.0",
    "IPython>=7.25.0",
    "psutil>=5.8.0",
    "pydicom>=2.3.0",
    "opencv-python>=4.5.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0"
]

[project.optional-dependencies]
interactive = [
    "ipympl>=0.9.0"
]
advanced = [
    "scikit-image>=0.18.0"
]

[project.urls]
Homepage = "https://www.larrysyuhenglai.com/projects/pyCoreRelator/"
Documentation = "https://github.com/GeoLarryLai/pyCoreRelator#readme"
Repository = "https://github.com/GeoLarryLai/pyCoreRelator.git"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyCoreRelator", "pyCoreRelator.*"]

